# ============================================================================
# Azure ML Workspace Deploy
# Mirrors the repo's existing pattern (apim-workflow.yml, asp-workflow.yml)
# ============================================================================

name: Azure ML Workspace Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'aml/**'
  workflow_dispatch:
    inputs:
      randomSuffix:
        description: '3-char suffix for KV/AML names (only needed when recreating soft-deleted resources)'
        required: false
        default: ''

jobs:
  call-baseline-workflow-passing-data:
    name: 'Run'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-module-template.yml
    with:
      modulePath: 'aml/'
      rgName: 'rg-aml-ai300-dev'
      randomSuffix: ${{ inputs.randomSuffix || '' }}
    secrets: inherit
